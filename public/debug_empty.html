<!DOCTYPE html><html lang="ru"><head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1">
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <style>
      @font-face {
          font-display: swap;
          font-family: Onest;
          font-weight: 400 700;
          src: url("https://st.ozone.ru/s3/ozon-fonts/onest.woff2") format("woff2")
      }

      :root {
          --floor0: #F0F2F5;
          --action-primary: #005bffff;
          --action-primary-hover: #0050e0ff;
          --action-secondary: rgba(0, 150, 255, 0.08);
          --action-secondary-hover: #d9e7ff;
          --text-title: #070707;
          --text-main-tertiary: rgba(0, 26, 52, 0.4);
      }

      * {
          box-sizing: border-box;
      }

      html, body {
          margin: 0;
          font-family: Onest, arial, sans-serif;
          font-weight: 400;
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          line-height: 20px;
      }

      a, button {
          border: none;
          cursor: pointer;
          transition: color .15s ease-in-out, background .15s ease-in-out;
          -webkit-appearance: none;
          -moz-appearance: none;
          appearance: none;
          text-decoration: none;
          font-weight: 600;
          font-size: 14px;
          font-family: inherit;
          color: inherit;
          letter-spacing: inherit;
      }

      main {
          display: flex;
          flex-direction: column;
          min-height: 100dvh;
          justify-content: center;
          width: 100%;
          background-color: var(--floor0);
          padding: 24px 28px;
      }

      [data-barcode]::before {
          content: attr(data-barcode);
      }

      .dt {
          display: block;
      }

      .mob {
          display: none;
      }

      .sec {
          background-color: #fff;
      }

      .bl {
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 16px;
          width: 100%;
          max-width: 1072px;
          margin: 0 auto;
          padding: 68px 18px 84px;
          border-radius: 32px;
          text-align: center;
      }

      .cnt {
          display: grid;
          gap: 8px;
      }

      .img {
          max-width: 104px;
          max-height: 104px;
          margin: 0 auto;
      }

      .title {
          font-weight: 700;
          font-size: 20px;
          line-height: 24px;
          color: var(--text-title);
      }

      .sign {
          font-size: 16px;
          line-height: 24px;
          color: rgba(0, 26, 52, 0.6);
      }

      .btns {
          display: flex;
          justify-content: center;
          gap: 8px;
      }

      .rb, .sb {
          padding: 6px 12px;
          border-radius: 8px;
          line-height: 20px;
      }

      .rb {
          background-color: var(--action-primary);
          color: #fff;
      }

      .rb:hover {
          background-color: var(--action-primary-hover);
      }

      .sb {
          background-color: var(--action-secondary);
          color: #005BFF;
      }

      .sb:hover {
          background-color: var(--action-secondary-hover);
      }

      .inc {
          order: 3;
          font-weight: 500;
          font-size: 12px;
          line-height: 16px;
          color: var(--text-main-tertiary);
          overflow-wrap: anywhere;
      }

      @media (max-width: 768px) {
          a, button {
              font-size: 16px;
              line-height: 24px;
          }

          main {
              justify-content: unset;
              padding: 0;
          }

          .dt {
              display: none;
          }

          .mob {
              display: block;
          }

          .bl {
              min-height: 100dvh;
              padding: 0 16px 16px;
              border-radius: 0;
          }

          .cnt {
              flex-grow: 1;
              align-content: center;
          }

          .img {
              max-width: 168px;
              max-height: 168px;
          }

          .title {
              font-size: 24px;
              line-height: 28px;
          }

          .btns {
              flex-direction: column;
          }

          .btn {
              width: 100%;
          }

          .rb, .sb {
              padding: 16px;
              border-radius: 12px;
              line-height: 24px;
          }

          .inc {
              order: unset;
          }
      }
  </style>

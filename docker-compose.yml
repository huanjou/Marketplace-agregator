services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: agregator-app
    container_name: agregator-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: Agregator
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agregator
      DB_USERNAME: agregator
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright:
        condition: service_healthy
    networks:
      - agregator

  playwright:
    build:
      context: ./docker/playwright
      dockerfile: Dockerfile
    image: agregator-playwright
    container_name: agregator-playwright
    restart: unless-stopped
    environment:
      POOL_SIZE: 4
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: info
      # Optional egress proxy for the browser pool (http://user:pass@host:port).
      # Unused at the moment: WB/Yandex Market work over direct egress, and
      # Ozon is scraped by the Camoufox service below instead.
      PROXY_URL: ${PROXY_URL:-}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agregator

  drissionpage:
    build:
      context: ./docker/drissionpage
      dockerfile: Dockerfile
    image: agregator-drissionpage
    container_name: agregator-drissionpage
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./public:/app/public
    environment:
      # Sticky RU residential proxy the Ozon scraper egresses through. Ozon's
      # ABT challenge binds cookies to the IP, so the line MUST keep one IP
      # for the whole session (rotation breaks scraping).
      PROXY_URL: ${OZON_PROXY_URL:-${PROXY_URL:-}}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - agregator


  nginx:
    image: nginx:alpine
    container_name: agregator-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - agregator

  postgres:
    image: postgres:16-alpine
    container_name: agregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agregator
      POSTGRES_USER: agregator
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agregator -d agregator"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agregator

  redis:
    image: redis:7-alpine
    container_name: agregator-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agregator

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: agregator-app
    container_name: agregator-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --tries=3 --timeout=120 --sleep=3
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: Agregator
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agregator
      DB_USERNAME: agregator
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agregator



  node:
    image: node:20-alpine
    container_name: agregator-node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    profiles:
      - dev
    networks:
      - agregator

  telegram-bot:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: agregator-app
    container_name: agregator-telegram-bot
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan nutgram:run
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: Agregator
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: agregator
      DB_USERNAME: agregator
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agregator

volumes:
  pg_data:
  redis_data:

networks:
  agregator:
    driver: bridge
